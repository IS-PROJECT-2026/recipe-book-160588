<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe | Baking Recipe Book</title>
  <meta name="description" content="View full recipe details, ingredients, and instructions.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- ============================= HEADER ============================= -->
  <header class="site-header">
    <div class="site-header__inner">
      <a href="index.html" class="logo">
        <span class="logo__text">
          Sharlet's Baking
          <small>Recipe Book</small>
        </span>
      </a>

      <nav class="main-nav" aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="categories.html">Categories</a></li>
        </ul>
      </nav>

      <a href="add.html" class="btn btn--primary btn--header">
        <span>+</span> Add Your Recipe
      </a>

      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- ============================= BREADCRUMB + HERO + INGREDIENTS/INSTRUCTIONS ============================= -->
  <!-- Everything inside #recipeDetail is rendered dynamically by recipe.js -->
  <main id="recipeDetail">
    <div class="detail-state" id="recipeState">
      <h2>Loading recipe...</h2>
      <p>Fetching the details for you.</p>
    </div>
  </main>

  <!-- ============================= LOVE THIS RECIPE (static) ============================= -->
  <section class="love-banner">
    <div class="love-banner__icon" aria-hidden="true"><span>♡</span><span>♡</span></div>
    <div class="love-banner__text">
      <h3>Love this recipe?</h3>
      <p>Save it to your favorites and share it with your fellow baking lovers!</p>
    </div>
    <button class="btn btn--primary" id="saveRecipeBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
      Save Recipe
    </button>
  </section>

  <!-- ============================= FOOTER ============================= -->
  <footer class="site-footer">
    <div class="site-footer__inner">
      <p class="site-footer__brand">Sharlet's Baking Recipe Book</p>
      <p class="site-footer__copyright">© 2026 All rights reserved.</p>
    </div>
  </footer>

  <!-- ============================= SCRIPTS ============================= -->
  <script type="module" src="src/firebase.js"></script>
  <script type="module" src="src/recipe.js"></script>
</body>
</html>
